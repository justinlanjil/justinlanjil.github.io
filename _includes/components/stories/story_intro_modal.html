{% assign modal_id = "exampleModal" %}

<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#{{ modal_id }}">
  Launch demo modal
</button>

<div class="modal fade" id="{{ modal_id }}" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Modal title</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        {{ page.excerpt }}
        {%- include components/stories/story_data.html -%}
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Read</button>
      </div>
    </div>
  </div>
</div>

<script type="text/javascript">
	var modalId = new bootstrap.Modal(document.getElementById("{{ modal_id }}"), {})
	modalId.show()
</script>
