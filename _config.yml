####


#### I need to refactor all this I think but putting it in for the moment



# Collections https://jekyllrb.com/docs/step-by-step/09-collections/
collections:
  pages:
    output: true
    permalink: /:path
  stories:
    output: true
    permalink: /stories/:name
  games:
    output: true
  20_games_challenge:
    output: true
    permalink: /20-games-challenge/:name
  interactive_fiction:
    output: true
    permalink: /interactive-fiction/:name
collections_dir     : collections
permalink           : /:year:month:day_:title/

# Defaults https://jekyllrb.com/docs/configuration/front-matter-defaults/
defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
      header_type: "base"
      include_on_search   : false
      cloudtag_url        : /tags #This is where the link on tags would redirect
      cloudcategory_url   : /categories #This is where the link on categories would redirect
  -
    scope:
      path: ""
      type: "posts"
    values:
      header_type       : "post"
      include_on_search : true
      include_on_feed   : true
      show_date         : true
      show_related      : false
      show_bottomnavs   : true
      show_sociallinks  : true
      show_comments     : true
      show_tags         : false
      show_categories   : false
      show_author       : false
      show_breadcrumb   : false
      breadcrumb_list   :
        - label: Blog
          url: /blog/
  -
    scope:
      path: ""
      type: "stories"
    values:
      layout: "short_story"
      header_type: "image"
      include_on_search   : true
      show_comments       : true
      show_bottomnavs     : false # would like to add this in but gotta adjust the loop
      show_tags           : false
      show_categories     : false
      sitemap: false #remove from sitemap and crawlers
  -
    scope:
      path: ""
      type: "games"
    values:
      layout: "default"
      header_type: "hero"
      include_on_search   : true
      show_comments       : true
      show_bottomnavs     : true
      show_tags           : false
      show_categories     : false
      play_url_text       : "play on itch.io "
      sitemap: false #remove from sitemap and crawlers
  -
    scope:
      path: "assets/img/gallery"
    values:
      image_col         : gallery
  -
    scope:
      path: "assets/img/placeholder"
    values:
      image_col         : placeholder
  -
    scope:
      path: "assets/img/posts/2024-04-02-sculpting-rough-maquettes/11_scale_mockup"
    values:
      image_col         : 11_scale_mockup

#####

exclude:
  - LICENSE
  - README.md
  - Gemfile
  - vendor

# Gems
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-include-cache

# apparently Sass is built in so idk if I need any of this

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions
    - mixed-decls
    - abs-percent
    - function-units
    - color-functions